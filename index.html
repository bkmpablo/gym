<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Gym</title>
<style>
:root{
  --bg:#0b0b0d; --card:#17171b; --card2:#202026; --line:#2a2a31;
  --text:#f4f4f6; --muted:#8d8d98; --accent:#d4ff3a; --accent-ink:#0b0b0d;
  --danger:#ff5a5f; --ok:#3ddc84;
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(var(--top) + 8px) 16px calc(var(--bot) + 96px);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--accent)}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:8px 0 16px}
h2{font-size:20px;font-weight:700;margin:24px 0 10px}
h3{font-size:17px;font-weight:700;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;background:var(--card2);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--card2)}
.iconbtn svg,.btn svg{width:20px;height:20px}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--card2);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.badge{font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex:none;font-size:14px}
.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.topbar h1{margin:0;font-size:24px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.hint{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:12px}

/* Workout */
.wex{background:var(--card);border-radius:16px;padding:14px 12px 10px;margin-bottom:12px}
.wex .head{display:flex;align-items:flex-start;gap:8px;margin:0 4px 8px}
.sethead,.set{display:grid;grid-template-columns:26px 1fr 72px 62px 44px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--muted);padding:0 4px 4px;text-transform:uppercase;letter-spacing:.04em}
.set{padding:4px;border-radius:12px;margin-bottom:2px}
.set .n{font-weight:700;text-align:center;color:var(--muted)}
.set .prev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{padding:8px 6px;text-align:center;border-radius:10px;height:40px}
.set .tick{height:40px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.set .tick svg{width:20px;height:20px;opacity:.5}
.set.done{background:rgba(212,255,58,.10)}
.set.done .tick{background:var(--accent);color:var(--accent-ink)}
.set.done .tick svg{opacity:1}
.set.done .n{color:var(--accent)}
.wex .foot{display:flex;gap:8px;margin-top:6px}
.wex .foot .btn{flex:1}
.timer{font-variant-numeric:tabular-nums}

/* Rest banner */
#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 74px);background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#rest.show{display:flex}
#rest .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;flex:1}
#rest button{background:rgba(0,0,0,.12);height:36px;padding:0 12px;border-radius:10px;font-weight:700}
#rest .bar{position:absolute;left:0;bottom:0;height:4px;background:rgba(0,0,0,.35);border-radius:0 0 0 16px}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,22,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(var(--bot) + 6px);z-index:20}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(var(--bot) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}

/* Routine editor */
.ritem{display:grid;grid-template-columns:1fr 46px 62px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ritem input{padding:8px 4px;text-align:center}
.ritem .ctl{display:flex;gap:4px}
.ritem .ctl button{width:28px;height:32px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.ritem .ctl svg{width:16px;height:16px}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#g)}
.chart .dt{fill:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--text)}
/* Calendario */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhead h2{margin:0;flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;font-weight:600}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--card2);position:relative;color:var(--muted)}
.cal .d.off{background:none}
.cal .d.tr{color:#0b0b0d;font-weight:800}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--text);color:var(--text)}
.cal .d.tr.today{box-shadow:inset 0 0 0 2px #0b0b0d}
.cal .d .dots{position:absolute;bottom:4px;display:flex;gap:2px}
.cal .d .dots i{width:4px;height:4px;border-radius:2px;background:#0b0b0d}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:5px;display:inline-block;flex:none}
.ymini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ym{background:var(--card);border-radius:14px;padding:10px;text-align:left}
.ym .t{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.ym .t b{color:var(--accent)}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.ym .g i{aspect-ratio:1;border-radius:2px;background:var(--card2)}
.ym .g i.off{background:none}
.sw{width:36px;height:36px;border-radius:10px;border:3px solid transparent}
.sw.on{border-color:var(--text)}
.up{color:var(--ok)} .down{color:var(--danger)}
.period .sess{font-size:13px;color:var(--muted);margin-top:4px}
.period .sess b{color:var(--text);font-weight:600}
#toast{position:fixed;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="view"></main>
<div id="rest"><span class="t">1:30</span><button data-act="restAdd" data-v="-15">−15</button><button data-act="restAdd" data-v="15">+15</button><button data-act="restSkip">Saltar</button><div class="bar"></div></div>
<nav id="tabs"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ============ Utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const fmt = n => n == null ? '' : (Math.round(n * 100) / 100).toString().replace('.', ',');
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);
const dfmt = (t, o = { weekday: 'short', day: 'numeric', month: 'short' }) => new Date(t).toLocaleDateString('es-ES', o);
const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const clock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

const I = {
  dumbbell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',

  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
};

/* ============ Datos base ============ */
const MUSCLES = ['Pecho','Espalda','Hombro','Bíceps','Tríceps','Cuádriceps','Femoral','Glúteo','Gemelo','Core','Antebrazo'];
const EQUIP = ['Barra','Mancuernas','Polea','Máquina','Peso corporal','Otro'];
const BASE_EX = [
  ['Press banca con barra','Pecho','Barra'],['Press banca inclinado con barra','Pecho','Barra'],['Press inclinado con mancuernas','Pecho','Mancuernas'],
  ['Press banca con mancuernas','Pecho','Mancuernas'],['Press declinado','Pecho','Barra'],['Aperturas con mancuernas','Pecho','Mancuernas'],

  ['Dominadas','Espalda','Peso corporal'],['Dominadas supinas','Espalda','Peso corporal'],['Jalón al pecho','Espalda','Polea'],

  ['Press militar con barra','Hombro','Barra'],['Press de hombro con mancuernas','Hombro','Mancuernas'],['Press de hombro en máquina','Hombro','Máquina'],
  ['Elevaciones laterales','Hombro','Mancuernas'],['Elevaciones laterales en polea','Hombro','Polea'],['Elevaciones frontales','Hombro','Mancuernas'],
  ['Pájaros (deltoides posterior)','Hombro','Mancuernas'],['Face pull','Hombro','Polea'],['Reverse pec deck','Hombro','Máquina'],
  ['Encogimientos de trapecio','Hombro','Mancuernas'],
  ['Curl con barra','Bíceps','Barra'],['Curl con barra Z','Bíceps','Barra'],['Curl con mancuernas','Bíceps','Mancuernas'],
  ['Curl martillo','Bíceps','Mancuernas'],['Curl inclinado','Bíceps','Mancuernas'],['Curl predicador','Bíceps','Máquina'],['Curl en polea','Bíceps','Polea'],

  ['Extensión sobre la cabeza','Tríceps','Mancuernas'],['Press banca agarre cerrado','Tríceps','Barra'],['Fondos en banco','Tríceps','Peso corporal'],

  ['Sentadilla','Cuádriceps','Barra'],['Sentadilla frontal','Cuádriceps','Barra'],['Sentadilla hack','Cuádriceps','Máquina'],
  ['Prensa de piernas','Cuádriceps','Máquina'],['Extensión de cuádriceps','Cuádriceps','Máquina'],['Zancadas','Cuádriceps','Mancuernas'],
  ['Sentadilla búlgara','Cuádriceps','Mancuernas'],['Aductores en máquina','Cuádriceps','Máquina'],
  ['Peso muerto rumano','Femoral','Barra'],['Curl femoral tumbado','Femoral','Máquina'],['Curl femoral sentado','Femoral','Máquina'],['Buenos días','Femoral','Barra'],
  ['Hip thrust','Glúteo','Barra'],['Patada de glúteo en polea','Glúteo','Polea'],['Abductores en máquina','Glúteo','Máquina'],

  ['Plancha','Core','Peso corporal'],['Crunch en polea','Core','Polea'],['Elevación de piernas colgado','Core','Peso corporal'],

];
const SEED_ROUTINES = [
  ['Pecho y hombro', [['Press banca con barra',4,'6-8'],['Press inclinado con mancuernas',3,'8-10'],['Cruce de poleas',3,'12'],['Press de hombro con mancuernas',3,'8-10'],['Elevaciones laterales',4,'12-15'],['Pájaros (deltoides posterior)',3,'15']]],
  ['Pierna', [['Sentadilla',4,'6-8'],['Prensa de piernas',3,'10-12'],['Peso muerto rumano',3,'8-10'],['Extensión de cuádriceps',3,'12'],['Curl femoral tumbado',3,'12'],['Elevación de gemelos de pie',4,'15']]],
  ['Espalda y abs', [['Dominadas',4,'6-10'],['Remo con barra',4,'8'],['Jalón al pecho',3,'10'],['Remo en polea baja',3,'10'],['Crunch en polea',3,'15'],['Elevación de piernas colgado',3,'12']]],
  ['Brazo', [['Curl con barra',4,'8-10'],['Curl inclinado',3,'10'],['Curl martillo',3,'12'],['Press francés',4,'8-10'],['Extensión de tríceps en polea',3,'12'],['Extensión sobre la cabeza',3,'12']]],
];
const COLORS = ['#d4ff3a', '#4cc9f0', '#ff9f43', '#ff5c8a', '#a78bfa', '#2dd4bf'];
const GREY = '#8d8d98';

/* ============ Almacenamiento ============ */
const KEY = 'gymapp.v1';
function seed() {
  return {

  <div class="card">${chartSVG(pts, 'kg')}</div>
  ${pts.length ? `<div class="stats"><div class="stat"><b>${r1(best)}</b><span>Mejor (kg)</span></div><div class="stat"><b>${r1(last)}</b><span>Último periodo</span></div><div class="stat"><b class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '+' : ''}${r1(delta)}</b><span>Desde el inicio</span></div></div>` : ''}
  <h2>${GROUP_TITLE[g]}</h2><p class="muted small" style="margin-top:-4px">Mejor serie de cada periodo y cambio respecto al anterior (${{ w: 'peso máx', '1rm': '1RM estimado', vol: 'volumen' }[m]}).</p>${list}`;
}
function vProgress() {
  const withData = db.exercises.filter(e => db.workouts.some(w => w.entries.some(en => en.exId === e.id)));
  if (!withData.length) return `<h1>Progreso</h1><div class="empty">Registra algún entreno y aquí verás cómo evolucionas en cada ejercicio.</div>`;

  const prs = withData.map(e => { let b = null; sessionsFor(e.id).forEach(s => s.sets.forEach(x => { if (!b || x.w > b.w || (x.w === b.w && x.r > b.r)) b = { ...x, date: s.date }; })); return { e, b }; }).filter(x => x.b);
  return `<h1>Progreso</h1>
  <select data-act="progEx" style="margin-bottom:12px">${withData.sort((a, b) => a.name.localeCompare(b.name, 'es')).map(e => `<option value="${e.id}" ${e.id === st.prog.ex ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>

/* ============ Hojas (modales) ============ */
function sheet(html) { const s = $('#sheet'); s.innerHTML = `<div class="backdrop" data-act="closeSheet"></div><div class="panel"><div class="grab"></div>${html}</div>`; s.classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; }
function openPicker(cb) {
  st.pick = cb; st.pickQ = ''; st.pickM = '';

function pickChips() { return `<button class="chip ${!st.pickM ? 'on' : ''}" data-act="pickM" data-v="">Todos</button>` + MUSCLES.map(m => `<button class="chip ${st.pickM === m ? 'on' : ''}" data-act="pickM" data-v="${m}">${m}</button>`).join(''); }

/* ============ Entreno ============ */
function startWorkout(routineId) {
  if (db.active && !confirm('Ya tienes un entreno en curso. ¿Descartarlo y empezar otro?')) return go('workout');
  const r = db.routines.find(x => x.id === routineId);
  db.active = { id: uid(), routineId: r ? r.id : null, name: r ? r.name : 'Entreno libre', color: r ? r.color : GREY, start: Date.now(),
    entries: r ? r.items.map(it => ({ exId: it.exId, target: it.reps, sets: Array.from({ length: +it.sets || 3 }, () => ({ w: '', r: '', done: false })) })) : [] };
  save(); go('workout');
}
function finishWorkout() {
  const a = db.active;
  const entries = a.entries.map(en => ({ exId: en.exId, sets: en.sets.filter(s => s.done).map(s => ({ w: num(s.w) ?? 0, r: num(s.r) ?? 0 })) })).filter(en => en.sets.length);
  if (!entries.length) { if (confirm('No has marcado ninguna serie como hecha. ¿Descartar el entreno?')) { db.active = null; save(); stopRest(); go(null); } return; }
  const pending = a.entries.reduce((n, en) => n + en.sets.filter(s => !s.done).length, 0);
  if (pending && !confirm(`Hay ${pending} series sin marcar, no se guardarán. ¿Terminar igualmente?`)) return;
  // Detectar récords
  const prs = entries.filter(en => { const prev = sessionsFor(en.exId); if (!prev.length) return false; const old = Math.max(...prev.map(s => sessionMetric(s.sets, 'w'))); return sessionMetric(en.sets, 'w') > old; });
  db.workouts.push({ id: a.id, routineId: a.routineId, name: a.name, color: a.color || GREY, start: a.start, end: Date.now(), entries });
  db.active = null; save(); stopRest();
  st.tab = 'calendar'; st.cal.y = new Date().getFullYear(); st.cal.m = new Date().getMonth(); st.cal.mode = 'month'; go(null);
  toast(prs.length ? `🏆 ¡Nuevo récord en ${prs.map(p => exById(p.exId).name).join(', ')}!` : '💪 Entreno guardado');
}

/* ============ Descanso ============ */
let rest = null, audioCtx = null;
function unlockAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
function beep() {
  try { if (!audioCtx) return; [0, .25, .5].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.25, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .18); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2); }); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function startRest() { const s = +db.settings.rest || 90; rest = { end: Date.now() + s * 1000, total: s }; $('#rest').classList.add('show'); tickRest(); }
function stopRest() { rest = null; $('#rest').classList.remove('show'); }
function tickRest() {
  if (!rest) return; const left = (rest.end - Date.now()) / 1000;
  if (left <= 0) { beep(); toast('⏱️ ¡A por la siguiente serie!'); stopRest(); return; }
  $('#rest .t').textContent = clock(left); $('#rest .bar').style.width = (100 * (1 - left / rest.total)) + '%';
}
function tickClock() { if (db.active) document.querySelectorAll('[data-clock]').forEach(el => el.textContent = clock((Date.now() - db.active.start) / 1000)); }
setInterval(() => { tickRest(); tickClock(); }, 250);

/* ============ Acciones ============ */
const A = {
  tab: el => { st.tab = el.dataset.v; st.screen = null; render(); window.scrollTo(0, 0); },
  go: el => go(el.dataset.v || null, el.dataset.p),
  start: el => startWorkout(el.dataset.v),
  finish: () => finishWorkout(),
  cancelWorkout: () => { if (confirm('¿Descartar este entreno? No se guardará nada.')) { db.active = null; save(); stopRest(); go(null); } },
  tick: el => {
    unlockAudio();
    const en = db.active.entries[+el.dataset.e], s = en.sets[+el.dataset.s];
    const row = el.closest('.set'), wi = row.querySelector('[data-f=w]'), ri = row.querySelector('[data-f=r]');
    if (!s.done) {
      if (s.w === '' && wi.placeholder !== 'kg') s.w = wi.placeholder.replace(',', '.');
      if (s.r === '' && /^\d+$/.test(ri.placeholder)) s.r = ri.placeholder;
      if (s.w === '' && s.r === '') { toast('Pon peso y reps'); return; }
      s.done = true; wi.value = s.w; ri.value = s.r; row.classList.add('done'); startRest();
    } else { s.done = false; row.classList.remove('done'); }
    save();
  },
  addSet: el => { const en = db.active.entries[+el.dataset.e]; const l = en.sets[en.sets.length - 1]; en.sets.push({ w: l ? l.w : '', r: l ? l.r : '', done: false }); save(); render(); },
  delSet: el => { const en = db.active.entries[+el.dataset.e]; if (en.sets.length > 1) { en.sets.pop(); save(); render(); } },
  exMenu: el => { const i = +el.dataset.e; sheet(`<h3>${esc(exById(db.active.entries[i].exId).name)}</h3><div style="height:12px"></div>
    <button class="btn block" data-act="exUp" data-e="${i}">${I.up} Subir</button><div style="height:8px"></div>
    <button class="btn block" data-act="exSwap" data-e="${i}">Cambiar por otro ejercicio</button><div style="height:8px"></div>
    <button class="btn block" data-act="openEx" data-v="${db.active.entries[i].exId}">Ver historial</button><div style="height:8px"></div>
    <button class="btn block danger" data-act="exRemove" data-e="${i}">Quitar del entreno</button>`); },
  exUp: el => { const i = +el.dataset.e, E = db.active.entries; if (i > 0) [E[i - 1], E[i]] = [E[i], E[i - 1]]; save(); closeSheet(); render(); },
  exRemove: el => { db.active.entries.splice(+el.dataset.e, 1); save(); closeSheet(); render(); },
  exSwap: el => { const i = +el.dataset.e; openPicker(id => { db.active.entries[i].exId = id; save(); render(); }); },
  addExWorkout: () => openPicker(id => { db.active.entries.push({ exId: id, target: '', sets: [0, 1, 2].map(() => ({ w: '', r: '', done: false })) }); save(); render(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50); }),
  closeSheet: () => { st.pick = null; closeSheet(); },
  back: () => go(st.back || null),
  picked: el => { const cb = st.pick; st.pick = null; closeSheet(); cb && cb(el.dataset.v); },
  pickM: el => { st.pickM = el.dataset.v; $('#pickChips').innerHTML = pickChips(); $('#pickList').innerHTML = exList(st.pickQ, st.pickM, 'picked'); },
  openEx: el => { st.pick = null; closeSheet(); st.back = st.screen; go('exercise', el.dataset.v); },
  libM: el => { st.lib.m = el.dataset.v; render(); },
  progM: el => { st.prog.m = el.dataset.v; render(); },
  progG: el => { st.prog.g = el.dataset.v; render(); },
  calMode: el => { st.cal.mode = el.dataset.v; render(); },
  calMonth: el => { st.cal.m = +el.dataset.v; st.cal.mode = 'month'; render(); },
  calNav: el => { const c = st.cal, v = +el.dataset.v; if (c.mode === 'year') c.y += v; else { c.m += v; if (c.m < 0) { c.m = 11; c.y--; } if (c.m > 11) { c.m = 0; c.y++; } } render(); },
  newExercise: el => { if (!el.closest('#sheet')) st.pick = null; exForm(null, el.dataset.v); },
  editExercise: el => exForm(exById(el.dataset.v)),
  saveExercise: el => {
    const name = $('#fxName').value.trim(); if (!name) return toast('Ponle un nombre');
    const data = { name, muscle: $('#fxMuscle').value, equip: $('#fxEquip').value, notes: $('#fxNotes').value.trim() };
    let id = el.dataset.v;
    if (id) Object.assign(exById(id), data); else { id = 'c-' + uid(); db.exercises.push({ id, custom: true, ...data }); }
    save(); closeSheet();
    if (st.pick) { const cb = st.pick; st.pick = null; cb(id); } else { st.lib.q = ''; render(); toast('Ejercicio guardado'); }
  },
  delExercise: el => { const id = el.dataset.v; const used = db.workouts.some(w => w.entries.some(e => e.exId === id)) || db.routines.some(r => r.items.some(i => i.exId === id));
    if (used) return toast('Está en uso en rutinas o historial'); if (!confirm('¿Borrar este ejercicio?')) return;
    db.exercises = db.exercises.filter(e => e.id !== id); save(); closeSheet(); go(null); },
  newRoutine: () => { st.draft = { id: uid(), name: '', color: COLORS.find(c => !db.routines.some(r => r.color === c)) || COLORS[0], items: [], isNew: true }; go('routine'); },
  rColor: el => { st.draft.color = el.dataset.v; render(); },
  editRoutine: el => { const r = db.routines.find(x => x.id === el.dataset.v); st.draft = JSON.parse(JSON.stringify(r)); go('routine'); },
  cancelRoutine: () => { st.draft = null; go(null); },
  saveRoutine: () => { const d = st.draft; if (!d.name.trim()) return toast('Ponle un nombre a la rutina');
    const { isNew, ...r } = d; r.name = r.name.trim(); r.items = r.items.map(it => ({ exId: it.exId, sets: Math.max(1, parseInt(it.sets) || 3), reps: String(it.reps || '').trim() }));
    if (isNew) db.routines.push(r); else db.routines[db.routines.findIndex(x => x.id === r.id)] = r;
    save(); st.draft = null; go(null); toast('Rutina guardada'); },
  delRoutine: () => { if (!confirm('¿Borrar esta rutina? El historial se mantiene.')) return; db.routines = db.routines.filter(r => r.id !== st.draft.id); save(); st.draft = null; go(null); },
  rAdd: () => openPicker(id => { st.draft.items.push({ exId: id, sets: 3, reps: '8-12' }); render(); }),
  rMove: el => { const i = +el.dataset.i, j = i + +el.dataset.v, it = st.draft.items; if (j < 0 || j >= it.length) return; [it[i], it[j]] = [it[j], it[i]]; render(); },
  rDel: el => { st.draft.items.splice(+el.dataset.i, 1); render(); },
  delWorkout: el => { if (!confirm('¿Borrar este entreno del historial?')) return; db.workouts = db.workouts.filter(w => w.id !== el.dataset.v); save(); go(null); },
  restAdd: el => { if (rest) { rest.end += +el.dataset.v * 1000; rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); tickRest(); } },
  restSkip: () => stopRest(),
  export: async () => {
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
    const name = `gym-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([blob], name, { type: 'application/json' });
    const done = () => { db.settings.lastBackup = Date.now(); save(); render(); toast('Copia guardada ✅'); };
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return done(); } catch (e) { if (e.name === 'AbortError') return; } }
    done(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  import: () => $('#importFile').click(),
  reset: () => { if (confirm('¿Seguro? Se borrará TODO: rutinas, historial y ejercicios personalizados.') && confirm('Última confirmación: ¿borrar todo?')) { db = seed(); save(); stopRest(); st.screen = null; st.tab = 'train'; render(); toast('Datos borrados'); } },
};

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return; const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && db.active) { const row = t.closest('.set'); const s = db.active.entries[+row.dataset.e].sets[+row.dataset.s]; s[t.dataset.f] = t.value.trim(); save(); return; }
  if (t.dataset.rf && st.draft) { st.draft.items[+t.closest('.ritem').dataset.i][t.dataset.rf] = t.value; return; }
  const act = t.dataset.act;
  if (act === 'libQ') { st.lib.q = t.value; $('#libList').innerHTML = exList(st.lib.q, st.lib.m, 'openEx'); }
  if (act === 'pickQ') { st.pickQ = t.value; $('#pickList').innerHTML = exList(st.pickQ, st.pickM, 'picked'); }
  if (act === 'rName') st.draft.name = t.value;
  if (act === 'setRest') { const v = parseInt(t.value); if (v > 0) { db.settings.rest = v; save(); } }
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'progEx') { st.prog.ex = e.target.value; render(); } });
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.version || !Array.isArray(d.workouts)) throw 0;
    if (!confirm(`La copia tiene ${d.workouts.length} entrenos y ${d.routines.length} rutinas. Reemplazará los datos actuales. ¿Continuar?`)) return;
    db = migrate(d); save(); st.screen = null; st.tab = 'train'; render(); toast('Copia importada ✅');
  } catch (err) { toast('Archivo no válido'); }
  e.target.value = '';
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickRest(); tickClock(); } });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
